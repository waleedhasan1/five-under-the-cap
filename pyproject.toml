[project]
name = "fivecap"
version = "0.1.0"
description = "Five Under the Cap: does lineup fit matter beyond individual talent?"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.0",
    "pandas>=2.1",
    "numpy>=1.26",
    "scikit-learn>=1.4",
    "ortools>=9.10",
    "streamlit>=1.35",
    "plotly>=5.20",
    # Not in the plan's stack table but required by it:
    "nba-api>=1.5",   # the data source named in the plan (section 6)
    "pyyaml>=6.0",    # reads config/settings.yaml
    "pyarrow>=15",    # parquet I/O for app_data/
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.5",
    "mypy>=1.10",
    "pandas-stubs",
    "types-PyYAML",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fivecap"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint.per-file-ignores]
# App pages hold long prose f-strings; wrapping them hurts readability more than it helps.
"app/**" = ["E501"]
